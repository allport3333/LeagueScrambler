@if (loading) {
  <app-page-loading label="Loading player scores"></app-page-loading>
}
@if (!loading) {
  <div>
    <table class='table'>
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
        </tr>
      </thead>
      @for (player of players; track player) {
        <tbody>
          <tr>
            <td>{{ player.firstName }}</td>
            <td>{{ player.lastName }}</td>
            <table class="table">
              <thead>
                <tr>
                  <th>Score</th>
                  <th>Date</th>
                </tr>
              </thead>
              @for (score of player.allPlayerScores; track score) {
                <tbody>
                  <tr>
                    <td>{{score.playersScore}}</td>
                    <td>{{score.date}}</td>
                  </tr>
                </tbody>
              }
            </table>
          </tr>
        </tbody>
      }
    </table>
  </div>
}
