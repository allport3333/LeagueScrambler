<section class="league-schedule">
 <h2>League Schedule</h2>
 <div *ngIf="loading" class="schedule-state" role="status"><p>Loading schedule...</p><mat-spinner diameter="40"></mat-spinner></div>
 <div *ngIf="error && !loading" class="schedule-state" role="alert"><p>{{ error }}</p><button mat-stroked-button type="button" (click)="retrySchedule()">Retry Schedule</button></div>
 <ng-container *ngIf="!loading && !error && selectedWeek">
  <nav class="week-navigation" aria-label="Schedule weeks">
   <button mat-icon-button type="button" aria-label="Previous Week" [disabled]="activeTabIndex === 0" (click)="selectWeek(activeTabIndex - 1)"><mat-icon>chevron_left</mat-icon></button>
   <mat-form-field appearance="outline"><mat-label>Scheduled week</mat-label><mat-select aria-label="Scheduled week" [value]="activeTabIndex" (selectionChange)="selectWeek($event.value)"><mat-option *ngFor="let week of schedule;let index=index" [value]="index">Week {{ week.weekNumber }} &middot; {{ week.date | date:'mediumDate' }}</mat-option></mat-select></mat-form-field>
   <button mat-icon-button type="button" aria-label="Next Week" [disabled]="activeTabIndex === schedule.length - 1" (click)="selectWeek(activeTabIndex + 1)"><mat-icon>chevron_right</mat-icon></button>
  </nav>
  <div class="schedule-matchups" aria-live="polite">
   <ng-container *ngFor="let week of [selectedWeek]">
                    <mat-card *ngFor="let match of week.matches"
                              [ngStyle]="{
              'background-color': match.division === 'Gold' ? '#FFF8DC' :
                                 match.division === 'Silver' ? '#E0E0E0' :
                                 match.division === 'Bronze' ? '#F5F5DC' : 'white',
              'border-left': match.division === 'Gold' ? '6px solid #FFD700' :
                              match.division === 'Silver' ? '6px solid #C0C0C0' :
                              match.division === 'Bronze' ? '6px solid #CD7F32' : 'none',
              'flex': '1 1 calc(33% - 20px)',
              'min-width': '250px',
              'max-width': '300px',
              'margin-bottom': '8px',
              'box-shadow': '0 2px 6px rgba(0, 0, 0, 0.2)',
              'border-radius': '8px',
              'transition': 'transform 0.2s, box-shadow 0.2s'
          }"
                              (mouseenter)="match.hovered = true"
                              (mouseleave)="match.hovered = false"
                              [style.transform]="match.hovered ? 'scale(1.03)' : 'scale(1)'"
                              [style.boxShadow]="match.hovered ? '0 4px 12px rgba(0, 0, 0, 0.3)' : '0 2px 6px rgba(0, 0, 0, 0.2)'">

                        <!-- Match Header -->
                        <mat-card-header style="text-align: center; display: flex; flex-direction: column;">
                            <mat-card-title style="text-align: center; font-weight: bold;">
                                {{ match.team1Name }}
                            </mat-card-title>
                            <mat-card-subtitle style="text-align: center; font-size: 14px; color: gray;">
                                vs
                            </mat-card-subtitle>
                            <mat-card-title style="text-align: center; font-weight: bold;">
                                {{ match.team2Name }}
                            </mat-card-title>
                        </mat-card-header>

                        <!-- Division Tag -->
                        <mat-chip *ngIf="match.division"
                                  [ngStyle]="{
                  'background-color': match.division === 'Gold' ? '#FFF8DC' :
                                     match.division === 'Silver' ? '#E0E0E0' :
                                     match.division === 'Bronze' ? '#F5F5DC' : '#E0E0E0',
                  'color': '#000',
                  'font-weight': 'bold',
                  'margin-top': '10px'
              }"
                                  style="align-self: center;">
                            {{ match.division }} Division
                        </mat-chip>
                    </mat-card>
   </ng-container>
  </div>
  <p class="schedule-state" *ngIf="!selectedWeek.matches || !selectedWeek.matches.length">No matchups scheduled for this week.</p>
 </ng-container>
 <p *ngIf="!loading && !error && !schedule.length" class="schedule-state">No schedule available for this league.</p>
</section>
