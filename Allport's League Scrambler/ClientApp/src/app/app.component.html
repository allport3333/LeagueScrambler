<div class="pwa-notice" *ngIf="pwa.offline" role="status">You are offline. Live data and saving are unavailable. Reconnect before making changes.</div>
<div class="pwa-notice pwa-update" *ngIf="pwa.updateAvailable" role="status"><span>A League Hub update is ready. Save your work before refreshing.</span><button type="button" mat-stroked-button [disabled]="pwa.offline || pwa.updating" (click)="pwa.refreshToUpdate()">Refresh to Update</button><span *ngIf="pwa.updateError">{{ pwa.updateError }}</span></div>
<div class='container-fluid'>
    <div class='row'>
        <div class='col-sm-12'>
            <app-nav-menu></app-nav-menu>
        </div>
    </div>
    <div class='row'>
        <div class='col-sm-12 body-content'>
            <router-outlet>
            </router-outlet>
        </div>
    </div>
</div>
