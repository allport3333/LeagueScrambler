<nav class="league-navigation" aria-label="Main navigation">
    <span *ngIf="!authenticationChecked" class="session-status" role="status">Checking session...</span>
    <button *ngIf="authenticationChecked && loggedIn" type="button" mat-button class="league-selector" id="leagueDropdown" [matMenuTriggerFor]="leagueMenu" [title]="selectedLeagueName || 'Select League'">
        <span class="league-name">{{ selectedLeagueName || 'Select League' }}</span><mat-icon aria-hidden="true">arrow_drop_down</mat-icon>
    </button>
    <mat-menu #leagueMenu="matMenu">
        <button mat-menu-item *ngFor="let league of leagues" [class.selected-league]="league.id === selectedLeagueId" (click)="onLeagueChange(league.id)">
            <mat-icon aria-hidden="true">{{ league.id === selectedLeagueId ? 'check' : 'chevron_right' }}</mat-icon>{{ league.leagueName }}
        </button>
    </mat-menu>

    <div class="desktop-navigation" #desktopLinks [class.navigation-measuring]="!layoutReady">
        <a *ngFor="let item of primaryLinks; trackBy: trackDestination" [routerLink]="item.route" routerLinkActive="active" #primaryActive="routerLinkActive" [routerLinkActiveOptions]="{exact: item.route === '/'}" [attr.aria-current]="primaryActive.isActive ? 'page' : null" class="navigation-link" (click)="collapse()">
            <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon><span>{{ item.label }}</span>
        </a>
        <button *ngIf="secondaryLinks.length" type="button" mat-button class="menu-trigger more-trigger" [class.active]="secondaryPageActive" [matMenuTriggerFor]="moreMenu">More<mat-icon aria-hidden="true">arrow_drop_down</mat-icon></button>
        <mat-menu #moreMenu="matMenu">
            <a mat-menu-item *ngFor="let item of secondaryLinks; trackBy: trackDestination" [routerLink]="item.route" routerLinkActive="selected-destination" #moreActive="routerLinkActive" [attr.aria-current]="moreActive.isActive ? 'page' : null" (click)="collapse()"><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>{{ item.label }}</a>
        </mat-menu>
    </div>
    <div class="desktop-account" *ngIf="authenticationChecked && loggedIn">
        <button type="button" mat-button class="menu-trigger" [class.active]="profilePageActive" [matMenuTriggerFor]="accountMenu"><mat-icon aria-hidden="true">account_circle</mat-icon> Account<mat-icon aria-hidden="true">arrow_drop_down</mat-icon></button>
        <mat-menu #accountMenu="matMenu">
            <a mat-menu-item *ngIf="playerId" [routerLink]="['/player-stats-tabs', playerId]" routerLinkActive="selected-destination" #accountActive="routerLinkActive" [attr.aria-current]="accountActive.isActive ? 'page' : null" (click)="collapse()"><mat-icon aria-hidden="true">person</mat-icon>Profile</a>
            <button type="button" mat-menu-item (click)="collapse(); logoutAndNavigate()"><mat-icon aria-hidden="true">exit_to_app</mat-icon>Logout</button>
        </mat-menu>
    </div>
    <button type="button" mat-icon-button class="drawer-toggle" aria-label="Open navigation" aria-controls="navigation-drawer" [attr.aria-expanded]="isExpanded" (click)="toggle()"><mat-icon aria-hidden="true">menu</mat-icon></button>
</nav>

<mat-sidenav-container class="navigation-drawer-container" [class.drawer-open]="isExpanded" [hasBackdrop]="true" (backdropClick)="collapse()">
    <mat-sidenav id="navigation-drawer" class="navigation-drawer" mode="over" position="end" [fixedInViewport]="true" [opened]="isExpanded" (closedStart)="collapse()" role="dialog" aria-modal="true" aria-label="Navigation menu">
        <header class="drawer-header"><strong>Navigation</strong><button type="button" mat-icon-button aria-label="Close navigation" (click)="collapse()"><mat-icon aria-hidden="true">close</mat-icon></button></header>
        <nav aria-label="Mobile navigation">
            <section *ngIf="drawerLinks('night').length"><h2>League Night</h2><ng-container *ngFor="let item of drawerLinks('night'); trackBy: trackDestination"><ng-container *ngTemplateOutlet="drawerLink; context: {$implicit: item}"></ng-container></ng-container></section>
            <section *ngIf="drawerLinks('results').length"><h2>Standings and Results</h2><ng-container *ngFor="let item of drawerLinks('results'); trackBy: trackDestination"><ng-container *ngTemplateOutlet="drawerLink; context: {$implicit: item}"></ng-container></ng-container></section>
            <section><h2>Account and Management</h2><ng-container *ngFor="let item of drawerLinks('management'); trackBy: trackDestination"><ng-container *ngTemplateOutlet="drawerLink; context: {$implicit: item}"></ng-container></ng-container>
                <a *ngIf="authenticationChecked && loggedIn && playerId" [routerLink]="['/player-stats-tabs', playerId]" routerLinkActive="active" #profileActive="routerLinkActive" [attr.aria-current]="profileActive.isActive ? 'page' : null" class="drawer-link" (click)="collapse()"><mat-icon aria-hidden="true">person</mat-icon>Profile</a>
                <button *ngIf="authenticationChecked && loggedIn" type="button" class="drawer-link" (click)="collapse(); logoutAndNavigate()"><mat-icon aria-hidden="true">exit_to_app</mat-icon>Logout</button>
            </section>
        </nav>
    </mat-sidenav>
</mat-sidenav-container>
<ng-template #drawerLink let-item>
    <a [routerLink]="item.route" routerLinkActive="active" #drawerActive="routerLinkActive" [routerLinkActiveOptions]="{exact: item.route === '/'}" [attr.aria-current]="drawerActive.isActive ? 'page' : null" class="drawer-link" (click)="collapse()"><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon><span>{{ item.label }}</span></a>
</ng-template>

<div class="nav-width-probe" #widthProbe aria-hidden="true"><span *ngFor="let item of visibleDestinations;trackBy:trackDestination" class="navigation-link" data-measure-route><mat-icon>{{ item.icon }}</mat-icon><span>{{ item.label }}</span></span><button mat-button class="menu-trigger" data-measure-more tabindex="-1">More<mat-icon>arrow_drop_down</mat-icon></button></div>
