﻿<h2 mat-dialog-title style="display: flex; justify-content: center;">Forgot Password</h2>
<div mat-dialog-content>
    <p>Enter the email address for your account.</p>
    <mat-form-field subscriptSizing="dynamic" style="width: 100%;">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="email" type="email" autocomplete="email" required>
    </mat-form-field>
</div>
<div mat-dialog-actions style="display: flex; justify-content: center;">
    <button mat-button (click)="onNoClick()">Cancel</button>
    <button mat-button (click)="onSubmit()">Submit</button>
</div>
