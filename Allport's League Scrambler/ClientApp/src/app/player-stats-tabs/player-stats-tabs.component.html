<section class="player-profile">
 <div class="profile-return" *ngIf="fromStandings"><button mat-stroked-button color="primary" type="button" (click)="backToStandings()">Back to Standings</button></div>
 <p *ngIf="loading" role="status" class="state-message">Loading player profile...</p>
 <div *ngIf="error" role="alert" class="state-message"><p>{{ error }}</p><button mat-stroked-button (click)="loadHeader(true)">Retry profile</button></div>
 <header class="profile-header" *ngIf="player && !loading && !error">
  <h1>{{ player.firstName }} {{ player.lastName }}</h1>
  <p>{{ selectedLeagueName || 'Select a league to explore statistics.' }}</p>
  <p class="profile-context"><span *ngIf="player.gender || player.isMale !== undefined">{{ player.gender || (player.isMale ? 'Male' : 'Female') }}</span><span *ngIf="player.divisionName">{{ player.divisionName }}</span></p>
 </header>
 <p *ngIf="selectingLeague" role="status" class="state-message">Selecting league...</p>
 <p *ngIf="leagueError" role="alert" class="state-message">{{ leagueError }}</p>
 <mat-tab-group class="profile-tabs" mat-align-tabs="center" [selectedIndex]="activeTab" (selectedIndexChange)="selectTab($event)" *ngIf="player && !loading && !error && !leagueError && !selectingLeague && selectedLeagueId">
  <mat-tab label="King/Queen Stats"><app-detailed-player-stats [playerId]="playerId" [leagueId]="selectedLeagueId"></app-detailed-player-stats></mat-tab>
  <mat-tab label="League Team Stats"><app-league-team-player-scores [playerId]="playerId" [leagueId]="selectedLeagueId"></app-league-team-player-scores></mat-tab>
  <mat-tab label="League Player Stats"><app-combined-stats-tab [playerId]="playerId" [leagueId]="selectedLeagueId"></app-combined-stats-tab></mat-tab>
 </mat-tab-group>
</section>
