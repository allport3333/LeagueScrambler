<div class="faq-container">
  <h1>Frequently Asked Questions</h1>
  @for (category of categories; track category) {
    <section class="faq-category" [attr.aria-labelledby]="'category-'+category.id">
      <h2 [id]="'category-'+category.id">{{ category.title }}</h2>
      @for (item of category.items; track item) {
        <div class="faq-item">
          <h3><button type="button" class="faq-question" [id]="'question-'+item.id" [attr.aria-expanded]="item.expanded" [attr.aria-controls]="'answer-'+item.id" (click)="toggleItem(item)"><span>{{ item.question }}</span><span class="arrow" aria-hidden="true">@if (item.expanded) {
          &#8722;
        } @else {
          +
        }</span></button></h3>
        <div class="faq-answer" [hidden]="!item.expanded" [id]="'answer-'+item.id" [attr.aria-labelledby]="'question-'+item.id"><p>@for (part of item.answer; track part) {
          @if (part.route) {
            <a [routerLink]="part.route" [queryParams]="navigationQuery(part)">{{ part.text }}</a>
          } @else {
            {{ part.text }}
          }
        }</p></div>
      </div>
    }
  </section>
}
</div>
