<section class="attendance-card" [class.attendance-compact]="loading || error || !state || !state.canSignIn" *ngIf="authenticated && (loading || error || state && state.visible && state.isOwnProfile)" aria-label="League night attendance">
 <h2 *ngIf="state && state.isOwnProfile && state.canSignIn && !loading && !error">League Night Sign In</h2>
 <p *ngIf="loading" role="status">Checking attendance...</p>
 <div *ngIf="error" role="alert"><p>{{ error }}</p><button mat-stroked-button (click)="load(true)">Refresh Attendance</button></div>
 <ng-container *ngIf="state && state.visible && state.isOwnProfile && !loading && !error">
  <div *ngIf="state.signedIn" class="signed-in-row"><p class="attendance-success" role="status"><mat-icon aria-hidden="true">check_circle</mat-icon> Signed In for Tonight</p><button *ngIf="state.canRemove" mat-button class="attendance-remove" [disabled]="busy" (click)="change(true)">{{ busy ? 'Updating...' : 'Remove Sign In' }}</button></div>
  <p *ngIf="state.reason || !state.signedIn && !state.canSignIn" class="attendance-reason"><mat-icon aria-hidden="true">{{ unavailableIcon }}</mat-icon><span>{{ unavailableText }}</span></p>
  <button *ngIf="state.canSignIn" mat-raised-button class="attendance-sign-in" [disabled]="busy" (click)="change()">{{ busy ? 'Signing In...' : 'Sign In for Tonight' }}</button>
 </ng-container>
</section>
