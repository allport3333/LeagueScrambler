<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Allport’s League Hub</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#343a40">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="League Hub">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allport’s League Hub" />
    <meta property="og:title" content="Allport’s League Hub" />
    <meta property="og:description" content="League standings, scrambles, and live results." />
    <meta property="og:url" content="https://allportsleaguescrambler.com/" />
    <meta property="og:image" content="https://allportsleaguescrambler.com/assets/img/sitelogo.png" />
    <meta property="og:image:secure_url" content="https://allportsleaguescrambler.com/assets/img/sitelogo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Allport’s League Hub" />
    <meta name="twitter:description" content="League standings, scrambles, and live results." />
    <meta name="twitter:image" content="https://allportsleaguescrambler.com/assets/img/sitelogo.png" />

    <!-- Styles -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.2/css/bootstrap.min.css"
          integrity="sha384-Smlep5jCw/wG7hdkwQ/Z5nLIefveQRIY9nfy6xoR1uRYBtpZgI6339F5dgvm/e9B"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.1.0/css/all.css"
          integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt"
          crossorigin="anonymous">

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    try {
      const theme = localStorage.getItem('league-hub-appearance');
      if (theme === 'navy' || theme === 'charcoal') {
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = 'dark';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'navy' ? '#111b2d' : '#1b1d20');
      }
    } catch {}
  </script>
</head>

<body>
    <app-root>
        <div class="startup-loader">
            <div id="startup-loading" role="status">
                <span class="startup-spinner" aria-hidden="true"></span>
                <span>Loading League Hub&hellip;</span>
            </div>
            <div id="startup-error" role="alert" hidden>
                <p>League Hub could not start. Check your connection and try again.</p>
                <button id="startup-retry" type="button">Retry</button>
            </div>
        </div>
    </app-root>
    <script>
        function showStartupError() {
            document.getElementById('startup-loading')?.setAttribute('hidden', '');
            document.getElementById('startup-error')?.removeAttribute('hidden');
        }

        const startupTimeout = setTimeout(showStartupError, 30000);
        addEventListener('league-hub-startup-error', () => {
            clearTimeout(startupTimeout);
            showStartupError();
        }, { once: true });
        addEventListener('league-hub-started', () => clearTimeout(startupTimeout), { once: true });
        document.getElementById('startup-retry')?.addEventListener('click', () => location.reload());
    </script>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.2/js/bootstrap.min.js" integrity="sha384-o+RDsa0aLu++PJvFqy8fFScvbHFLtbvScb8AjopnFD+iEQ7wo/CG0xlczd+2O/em" crossorigin="anonymous"></script>
</body>
</html>
